<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>moleculer-socket.io</title>
	<script src = "https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
</head>
<body>
	<div class="content" id="content">
		<div class="title">SOCKET MOLECULER</div>
		<input type="text" placeholder="E-mail" id="email"/>
		<input type="password" placeholder="Password" id="password"/>
		<input id="rememberMe" type="checkbox"/>
		<label for="rememberMe"></label><span>I have read and agree to the<a href="#">Terms of Use</a>and<a href="#">Privacy Policy</a></span>
		<button type="submit" id="btnDangNhap">Login</button>
		<div class="social"> <span>or sign up with social media</span></div>
		<div class="buttons">
		  <button class="facebook"><i class="fa fa-facebook"></i>Facebook</button>
		  <button class="twitter"><i class="fa fa-twitter"></i>Twitter</button>
		  <button class="google"><i class="fa fa-google-plus"></i>Google</button>
		</div>
		<!-- <div class="already">Already have an account?<a href="#">Sign In</a></div> -->
	</div>
	<div id="content-wrap" class="container p-5">
        <div class="row">
            <div class="col-4 p-2 text-center">
                <table class="table">
                    <thead>
                      <tr>
                        <th scope="col">LIST USERS ONLINE</th>
                      </tr>
                    </thead>
                    <tbody id="table-content">
                    
                    </tbody>
                  </table>
            </div>
            <div class="col-8">
                <h2>Chatting</h2>
                <h4>Hello <span id="show-userName"></span></h4>
                <div id="content-box" style="border: 1px solid #999; height: 200px; width: 400px; padding: 20px; overflow-y: scroll;">
                    
                </div>
                <div id="chatInput-wrap" class="mt-2">
                    <h5>Send</h5>
                    <input id="inputChat" type="text">
                    <br>
                    <button id="submitChat" class="mt-4">Send</button>
                </div>
            </div>
        </div>
    </div>
	<!-- img src="images/logo.png" /-->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js"></script>

	<script>
		let socket =  io("http://localhost:4000/");
		let userName
		socket.once("connect", () => {
			$(document).on("click","#btnDangNhap", function(e){
				e.preventDefault();
				let email = $("#email").val();
				let password = $("#password").val();
				$.ajax({
					url: `http://localhost:3003/api/accounts/sign-in`,
					method: "POST",
					data: {
						email, password
					},
					success: resp =>{
						if(resp.error){
							console.log(resp.message);	
							return;
						}
						socket.emit('client-register', resp.data.user.email )
						// document.location.href = `/socket/index.html`
					}
				})
			});
			$('#submitChat').click(function (e) { 
				e.preventDefault();
				let data = {
						message: $("#inputChat").val(), userName: userName
					}
				socket.emit('client-send-chat', data)
			});
			socket.on('server-not-register', () => {
				alert('Username đã tồn tại')
			})


			socket.on('server-register-success', (data) => {
				userName = data
				$('#show-userName').append(data)
				$('#content').hide(1000);
				$('#content-wrap').css("display", "block");
    			$('#content-wrap').show(1000)
			})

			socket.on('server-send-list-users', data => {
				$("#table-content").html("")
				data.forEach(i => {
					$("#table-content").append(
						"<tr>" +
						"<th>" + i.email + "</th>" + "</tr>"     
					)
				});
			})
			socket.on('server-send-message', data => {
				$("#inputChat").val("");
				$("#content-box").append(
					" <div id='content-item' style='padding: 5px; margin: 10px; background-color: rgb(223, 223, 223); border-radius: 10px;'>" +
					"<span id='content-item-userName' style='font-weight: bold; margin-right: 5px;'>" +
							data.userName +
					"</span> <span id='content-item-content'>" +
							data.message +
					"</span></div>"
				)
			})
		})

			// socket.emit('LOGOUT', {socket: socket.id})
		});

	</script>
</body>
</html>
