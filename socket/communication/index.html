<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>moleculer-socket.io</title>
	<script src = "https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
</head>
<body>
	<!-- img src="images/logo.png" /-->
	<div class="container">
		<div class="row">
			<div class="row">
                <div class="col-6">
                    <form>
                        <div class="form-group">
                            <label for="exampleInputEmail1">Name</label>
                            <input type="text" class="form-control" id="name" aria-describedby="emailHelp">
                        </div>
                        <button type="submit" id="btnLogout" class="btn btn-primary">Submit</button>
                    </form>
                </div>
                <div class="col-3">
                    <h1>Room Online</h1>
                    <div id="listRoom">ROOM1
                       
                    </div>
                    <div id="listRoom2">ROOM2
                       
                    </div>
                    <form>
                        <div class="form-group">
                            <label for="exampleInputEmail1">message</label>
                            <input type="text" class="form-control" id="message" aria-describedby="emailHelp">
                        </div>
                        <button type="submit" id="btnSendMessage" class="btn btn-primary">Submit</button>
                    </form>
                </div>
                <div class="col-3">
                    <h1>Message</h1>
                    <div id="communication">
                        
                    </div>
                </div>
            </div>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js"></script>
	<script>
		// let url = window.location.href;
		// console.log({url});
		// let token = url.splice(26);
		// let token = localStorage.getItem('access_token');
		// console.log({token});
		// http://127.0.0.1:5500/socket/index.html
		let socket =  io("http://localhost:3000",
		);
		let name;
		socket.once("connect", () => {
			console.log("Websocket connection established!");

			socket.on("LOGIN_SUCCESS", function(data) {
                console.log({data})
                // name = data.name;
                if(data.room){
                    data.room.forEach(user => {
                        if (user.socketID != socket.id){
                            $("#listRoom").append(`
                                <p>
                                    ${user.user.name}
                                </p>
                            `)
                        }
                    });
                                     
                }
                else if(data.roomAfterInsertRoom2){
                    data.roomAfterInsertRoom2.forEach(user => {
                        if (user.socketID != socket.id){
                            $("#listRoom2").append(`
                                <p>
                                    ${user.user.name}
                                </p>
                            `)
                        }
                    });
                   
                }
                 

                
                // if(data.room2){
                //     data.room2.forEach(user => {
                //         if (data.name != user.name){
                //             $("#listRoom").append(`
                //                 <p>
                //                     ${user.name}
                //                 </p>
                //             `)
                //         }
                //     });
                // }
            })
            socket.on("NEW_USER_ROOM1", function(data) {
                        console.log("--NEW_USER--");
                        console.log({data});
                        let { roomName } = data
                        if(roomName== 'room1'){
                            $("#listRoom").append(`
                            ${data.name}
                        `)
                        }
                      
                    });  
            socket.on("NEW_USER_ROOM2", function(data) {
                        console.log("--NEW_USER--");
                        console.log({data});
                        let { roomName } = data

                        if(roomName== 'room2'){
                        $("#listRoom2").append(`
                            ${data.name}
                        `)
                        }
                    });

            socket.on("RECEIVER_MESSAGE", function(data){
                console.log({data})
                $("#communication").append(`
                    <p>
                        ${data.message}
                    </p>
                `)
            })
            
            socket.on("DISCONNECT", function(data) {
                    
            });

            socket.on("disconnect", function(data) {
                console.log("--disconnect--");
                console.log({data});
            });

            socket.on("event", function(data){
                console.log("--event--");
                console.log(data);
            });
	    });

        $(document).on("click","#btnLogout", function(e){
            e.preventDefault();
            let name = $("#name").val()
            socket.emit("LOGIN_SUCCESS",{name, socketID: socket.id});
            
        })
        // window.socket = socket;
        
        $(document).on("click","#btnSendMessage", function(e){
            e.preventDefault();
            let message = $("#message").val()
            console.log({message, socketID: socket.id});
            socket.emit("SEND_MESSAGE",{message, socketID: socket.id});
        })

	</script>
</body>
</html>
